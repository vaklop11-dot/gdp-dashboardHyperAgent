name: Streamlit App Health Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  streamlit-start:
    name: Start Streamlit and verify app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Validate Python syntax
        run: python -m py_compile app.py

      - name: Start Streamlit app and verify port
        run: |
          python -m streamlit run app.py --server.port 8503 > streamlit.log 2>&1 &
          STREAMLIT_PID=$!
          sleep 8
          curl --retry 10 --retry-connrefused --max-time 10 -I http://127.0.0.1:8503
          kill "$STREAMLIT_PID" || true
